[workspace]
members = [
  "crates/mneme-kernel",
  "crates/mneme-api",
  "crates/mneme-daemon",
  "crates/mneme-server",
  "crates/mneme-sync",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/cyeonix/mneme"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.7"
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "time", "uuid", "json", "migrate"] }
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
tokio = { version = "1.41", features = ["macros", "rt-multi-thread", "net", "fs"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
